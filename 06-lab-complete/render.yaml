services:
  # Managed Redis (Render "Key Value") cho rate limiter + cost guard
  - type: keyvalue
    name: day14-redis
    plan: free
    # Private: không nhận kết nối từ internet, chỉ service trong cùng environment
    ipAllowList: []

  - type: web
    name: day14-production-agent
    runtime: docker
    # Repo gốc chứa 6 thư mục: chỉ build 06-lab-complete/
    rootDir: 06-lab-complete
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
